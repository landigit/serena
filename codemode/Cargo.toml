[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
blake3 = "1.8"
dashmap = "6.2.1"
ignore = "0.4.35"
libc = "0.2.191"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
thiserror = "2.0.21"
toml = "1.2"
tree-sitter = "0.27.2"
url = "2.5.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
