[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
blake3 = "1.8"
serde = { version = "1.0.229", features = ["derive"] }
similar = "3.2.1"
thiserror = "2.0.21"
toml = "1.2"
tree-sitter = "0.27.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
